<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="927" viewBox="0 0 1750 927" role="img" aria-labelledby="title description">
  <title id="title">C4. Компоненты веб-приложения фитнес-клуба</title>
  <desc id="description">Веб-интерфейс, доступ, отчёты, посещения, запись и расписание, клиенты и абонементы, оплаты и интеграции. Система использует общую базу данных и три внешних сервиса.</desc>
